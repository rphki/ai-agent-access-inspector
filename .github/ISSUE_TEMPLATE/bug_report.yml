name: Bug report
description: Something does not work or a finding is wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do **not** report security vulnerabilities here; use "Report a security vulnerability" instead (see `SECURITY.md`).
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: e.g. macOS 15.4, Windows 11 24H2, Ubuntu 24.04
  - type: input
    id: version
    attributes:
      label: App version
      description: "CLI: `ai-agent-access-inspector --version`. GUI: shown in the header below the title."
      placeholder: e.g. 0.4.0
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: CLI or GUI
      options:
        - CLI
        - GUI
        - Both
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For the CLI, include the exact command.
      placeholder: |
        1. Run `ai-agent-access-inspector scan --format markdown`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages or diagnostics, if any.
    validations:
      required: true
  - type: textarea
    id: export
    attributes:
      label: Export (optional)
      description: |
        An export helps to reproduce wrong findings. Create it with anonymised paths:
        - CLI: `ai-agent-access-inspector scan --paths anonymized` (add `--format markdown` for a readable report)
        - GUI: "Export …" with the option "Home directory as ~ and anonymised user names"

        **Check the export before posting it.** The inspector redacts values that look like secrets, but it cannot recognise every secret. Remove tokens, passwords, internal host names, project names and anything else you do not want to make public. Issues are public.
      render: json
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Agent version, unusual configuration locations, anything else that may help.
