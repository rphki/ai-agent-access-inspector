name: Release

# A tag `vX.Y.Z` builds the CLI and the GUI for all platforms and publishes
# a GitHub release. Running the workflow manually only builds the archives
# and installers (no release), which is useful to check the build before
# tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Actions are pinned to commit SHAs (Dependabot keeps them current), so a
# moved tag cannot change what runs with the release token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY: ai-agent-access-inspector

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The GUI is tested in its own job, which has the system packages.
      - name: Test
        run: cargo test --workspace --exclude inspector-gui --locked
      - name: Build
        run: cargo build --release --locked -p inspector-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="${BINARY}-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp LICENSE README.md CHANGELOG.md "dist/${name}/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/${BINARY}.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/${BINARY}" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  gui:
    name: GUI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal app for Apple Silicon and Intel.
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          # The oldest supported runner, so that the AppImage and the .deb
          # run on older distributions (glibc).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: rustup target add ${{ matrix.rust-targets }}
      - name: Install Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache in release builds: a cache can be written by
      # other workflow runs, the release must only depend on the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: |
          pnpm test
          cargo test -p inspector-gui --locked
      # Unsigned: macOS is signed ad hoc (tauri.conf.json), Windows not at
      # all. See docs/release-process.md.
      - name: Build
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect installers
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # Not `dist/`: that is Vite's output folder for the frontend.
          prefix="installers/${BINARY}-gui-${version}"
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir -p installers
          shopt -s nullglob
          for file in "$bundle"/dmg/*.dmg; do cp "$file" "${prefix}-macos-universal.dmg"; done
          for file in "$bundle"/nsis/*-setup.exe; do cp "$file" "${prefix}-windows-x64-setup.exe"; done
          for file in "$bundle"/msi/*.msi; do cp "$file" "${prefix}-windows-x64.msi"; done
          for file in "$bundle"/appimage/*.AppImage; do cp "$file" "${prefix}-linux-x86_64.AppImage"; done
          for file in "$bundle"/deb/*.deb; do cp "$file" "${prefix}-linux-amd64.deb"; done
          ls -l installers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-${{ matrix.target }}
          path: installers/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml" >&2
            exit 1
          fi
          frontend=$(jq -r .version package.json)
          if [ "${frontend}" != "${version}" ]; then
            echo "package.json has version ${frontend}, Cargo.toml ${version}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check the downloaded files
        run: |
          # Only release files, nothing else (e.g. a frontend build).
          if find dist -mindepth 1 -type d | grep -q .; then
            echo "Unexpected directories in dist:" >&2
            find dist -mindepth 1 -type d >&2
            exit 1
          fi
          ls -l dist
      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Extract release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == v0.* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            ${prerelease}
