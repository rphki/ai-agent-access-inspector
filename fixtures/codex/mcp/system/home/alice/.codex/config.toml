[projects."/home/alice/app"]
trust_level = "trusted"

[mcp_servers.files]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "~/Documents", "/srv/data"]

[mcp_servers.tool]
command = "python3"
args = ["server.py", "./data", "--token", "fixture-arg-never-shown"]
cwd = "/opt/tool"

[mcp_servers.remote]
url = "https://mcp.example.test/sse"
bearer_token_env_var = "FIXTURE_TOKEN"
http_headers = { Authorization = "Bearer fixture-header-never-shown" }

[mcp_servers.off]
command = "off-server"
enabled = false

[mcp_servers.shared]
command = "user-version"
