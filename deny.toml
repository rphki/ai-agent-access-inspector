# Configuration for cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`; CI runs the same check.

[graph]
all-features = true

# Known vulnerabilities and unmaintained or yanked crates (RustSec database).
[advisories]
yanked = "deny"

# Only permissive licenses compatible with Apache-2.0.
[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace crates are not published; their license is the repository's.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version requirement.
allow-wildcard-paths = true

# Crates may only come from crates.io.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
